# LiveReplay server behind Caddy (automatic HTTPS). Point DOMAIN's DNS at this machine, put the
# settings below in a `.env` file next to this one, then: docker compose up -d --build
#
#   DOMAIN=wot.arne.my
#   OPERATOR_NAME=...        # who runs the site (shown on /privacy, GDPR controller)
#   OPERATOR_CONTACT=...     # e-mail or URL for data requests (shown on /privacy)
#   OPERATOR_ADDRESS=...     # postal address, e.g. "Street 1, 12345 Town, Germany" (Impressum /impressum; also /privacy)
#   OPERATOR_PHONE=...       # optional phone number (Impressum)
#   ADMIN_TOKEN=...          # long random string: removal requests (see README)
#   DATA_PATH=/mnt/data/livereplay   # optional: keep all data in this host folder (e.g. another drive);
#                                    # the folder must be writable by uid 1000: sudo chown -R 1000:1000 /mnt/data/livereplay
#                                    # default: the Docker volume "livereplay-data"
services:
  livereplay:
    build: .
    restart: unless-stopped
    # Hardening: nothing in the container can be changed except the data folder, no Linux
    # capabilities, no privilege gain. Bounded memory and CPU: it shares a small machine (uploads
    # and downloads are streamed from disk; the server itself needs a few MB plus its index).
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.5
    environment:
      - OPERATOR_NAME=${OPERATOR_NAME:-}
      - OPERATOR_CONTACT=${OPERATOR_CONTACT:-}
      - OPERATOR_ADDRESS=${OPERATOR_ADDRESS:-}
      - OPERATOR_PHONE=${OPERATOR_PHONE:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    volumes:
      # Battles, codes, uploaded map data: back this up. A host folder when DATA_PATH is set.
      - ${DATA_PATH:-livereplay-data}:/data
  caddy:
    # Always the newest Caddy 2 (security fixes, e.g. 2.11.4) on every `docker compose up`.
    image: caddy:2
    pull_policy: always
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-wot.arne.my}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  livereplay-data:
  caddy-data:
  caddy-config:
