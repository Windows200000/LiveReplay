[package]
name = "livereplay-web"
version = "0.1.0"
edition = "2021"
description = "LiveReplay web viewer (WebAssembly)"
license = "CC-BY-NC-SA-4.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
livereplay = { path = ".." }
livereplay-api = { path = "../api" }
eframe = "0.29"
egui = "0.29"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "History", "Storage", "Headers", "Request", "RequestInit", "Response", "Navigator", "Clipboard", "console", "Document", "Element", "HtmlCanvasElement"] }
