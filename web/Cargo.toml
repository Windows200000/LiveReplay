[package]
name = "livereplay-web"
version = "1.0.0"
edition = "2021"
description = "LiveReplay web viewer (WebAssembly)"
license = "CC-BY-NC-SA-4.0"

[lib]
crate-type = ["cdylib", "rlib"]

# The viewer only exists in the browser build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
livereplay = { path = ".." }
livereplay-api = { path = "../api" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "web_screen_reader"] }
egui = "0.37"
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "History", "Storage", "Headers", "Request", "RequestInit", "Response", "Navigator", "Clipboard", "console", "Document", "Element", "HtmlCanvasElement"] }
