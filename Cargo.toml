[workspace]
members = [".", "api", "server", "web"]
resolver = "2"

[package]
name = "livereplay"
# Major.minor are set here; the last number is counted up by CI for every push to main (each one
# is a release, see .github/workflows/build.yml).
version = "1.1.0"
edition = "2021"
description = "World of Tanks replay viewer: in-game style 2D minimap and simplified 3D, live battles, replay library"
license = "CC-BY-NC-SA-4.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "livereplay"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "glow", "wayland", "x11", "web_screen_reader"] }
# Monochrome emoji fonts (the symbols on buttons, as before 0.37; without them they come out as colour emoji).
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Replay decryption + decompression (the replay and game-data parsers are our own).
blowfish = "0.10"
flate2 = "1"
sha2 = "0.11"
livereplay-api = { path = "api" }
# Compact binary encoding of battles for the server and the web viewer.
# Self-describing (fields by name), so stored battles stay readable when fields are added.
ciborium = "0.2"

# Desktop only: settings and cache folders.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = "6"
# Uploads to the LiveReplay server (blocking, from background threads).
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
getrandom = "0.4"

# Tray icon (close to tray). Linux: StatusNotifier over D-Bus (no GTK needed).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
raw-window-handle = "0.6"
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.26", default-features = false }
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

# Windows: tray icon (close to tray, start with Windows); the window handle to show/hide it.
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }
# Start with Windows: a shortcut in the Startup folder.
mslnk = "0.1"
raw-window-handle = "0.6"

# Web build: viewer settings in localStorage.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }

# The server's HTTP library, with fixes (vendor/tiny_http/PATCHES.md).
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = 3

# Web viewer: small download (cargo build --profile web --target wasm32-unknown-unknown -p livereplay-web).
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
