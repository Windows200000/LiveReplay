# Builds the desktop app for Windows, Linux and macOS (x64 + arm64), checks the server and web
# viewer, and builds the Docker image. Artifacts: one desktop binary per platform.
# Publishing: every push to main replaces the files of the `latest-build` pre-release. When the
# version in Cargo.toml has no release yet, that push also creates the tag `v<version>` and the
# release (so a release is: raise the version, push to main). Pushing a `v*` tag by hand works too.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, bin: livereplay.exe }
          - { name: windows-arm64, os: windows-11-arm, bin: livereplay.exe }
          - { name: linux-x64, os: ubuntu-24.04, bin: livereplay }
          - { name: linux-arm64, os: ubuntu-24.04-arm, bin: livereplay }
          - { name: macos-x64, os: macos-15-intel, bin: livereplay }
          - { name: macos-arm64, os: macos-15, bin: livereplay }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries (egui/winit)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo test --release --lib
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: livereplay-${{ matrix.name }}
          path: target/release/${{ matrix.bin }}

  server-and-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p livereplay-server
      - run: cargo build --release --target wasm32-unknown-unknown -p livereplay-web

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t livereplay-server .
      - name: Caddyfile is valid
        run: docker run --rm -e DOMAIN=example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy adapt --config /etc/caddy/Caddyfile --validate > /dev/null
      - name: Compose file is valid
        run: docker compose config -q

  publish:
    needs: [desktop, server-and-web, docker]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: "Package: Windows .exe, Linux/macOS .tar.gz (keeps the executable bit)"
        run: |
          mkdir dist
          for d in artifacts/livereplay-*; do
            name=$(basename "$d")
            if [ -f "$d/livereplay.exe" ]; then
              cp "$d/livereplay.exe" "dist/$name.exe"
            else
              chmod +x "$d/livereplay"
              tar -czf "dist/$name.tar.gz" -C "$d" livereplay
            fi
          done
          ls -l dist
      - name: latest-build pre-release
        if: github.ref == 'refs/heads/main'
        run: |
          short=${GITHUB_SHA::7}
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest-build" -f sha="$GITHUB_SHA" -F force=true
          gh release upload latest-build dist/* --clobber
          gh release edit latest-build --prerelease --title "Latest build" --notes "Latest build of LiveReplay, commit $short. Replaced with every push to main. Windows: .exe; Linux and macOS: .tar.gz (the app inside is unsigned — on macOS right-click → Open the first time). Third-party licences: THIRD_PARTY_LICENSES.md."
      - name: Versioned release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            tag="$GITHUB_REF_NAME"
          else
            # The app's version (the [package] of the root Cargo.toml).
            version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            tag="v$version"
            if [ -z "$version" ] || gh release view "$tag" > /dev/null 2>&1; then
              echo "release $tag exists already: nothing to publish"
              exit 0
            fi
          fi
          # Creates the tag at this commit when it doesn't exist yet.
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "LiveReplay ${tag#v}" --notes "LiveReplay ${tag#v}. Windows: .exe; Linux and macOS: .tar.gz (the app inside is unsigned — on macOS right-click → Open the first time). Third-party licences: THIRD_PARTY_LICENSES.md." --latest
